    <div class="main-column">
      <div class="module-card" id="documentary-intent-module">
        <h2>What documentaries capture the feeling you're going for?</h2>
        <p style="font-size: 13px; margin: 0 0 14px;">
          Build a moodboard of reference documentaries—name one or paste a YouTube link.
          We'll study their style and use it to suggest a narrative arc, mode, and techniques for your research documentary.
        </p>

        <div id="moodboard-add-row" class="moodboard-add-row">
          <div class="moodboard-add-group">
            <input type="text" id="moodboard-name-input" placeholder="Name a documentary (e.g. Free Solo)">
            <button type="button" id="moodboard-add-name-btn" class="btn-secondary">Add</button>
          </div>
          <div class="moodboard-add-group">
            <input type="url" id="moodboard-url-input" placeholder="Paste a YouTube link">
            <button type="button" id="moodboard-add-url-btn" class="btn-secondary">Add</button>
          </div>
        </div>

        <div id="moodboard-list" class="moodboard-list"></div>
        <div id="moodboard-status" class="status-line"></div>
      </div>

      <div id="moodboard-next-row" class="setup-next-row">
        <button type="button" id="moodboard-next-btn" class="btn-primary">NEXT STEP: NARRATIVE ARC</button>
        <div id="moodboard-next-status" class="status-line"></div>
