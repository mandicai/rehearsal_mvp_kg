<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calibrate BKT Priors</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<h1>Calibrate BKT Priors</h1>

<!-- Collects real human data (not LLM-simulated) on how much a stated
     audience already knows a topic BEFORE any instruction - used to tune
     js/simulate-audience.js's BKT_DEFAULTS.priorKnow (and friends) from
     evidence instead of a single eyeballed constant applied to everyone.
     Reuses the exact same generate_question/grade_answers LLM calls the
     Simulate Audience module already uses - only simulate_answer/suggest_fix
     are skipped, since a real person answers instead of an LLM persona. -->
<div id="test-item-module" class="module-card">
  <h2>1. Define a Test Item</h2>
  <div class="audience-input-row">
    <input type="text" id="calibrate-audience-input" placeholder="Audience description (e.g. novice research audience, domain expert audience)">
  </div>
  <div class="audience-input-row">
    <input type="text" id="calibrate-topic-input" placeholder="Learning objective / topic (e.g. Explain the CAP theorem)">
  </div>
  <textarea id="calibrate-context-input" class="transcript-text-input" rows="4" placeholder="Optional: paste a real slide/section transcript here to ground the question in an actual presentation. Leave blank for a general-knowledge topic question."></textarea>
  <button id="generate-question-btn" class="btn-primary" style="margin-top: 12px;">Generate Question</button>
  <div id="generate-question-status" class="status-line"></div>
</div>

<div id="answer-module" class="module-card disabled">
  <h2>2. Answer as a Real Person</h2>
  <p style="font-size: 13px; opacity: 0.85; margin-top: 0;">
    Have someone who actually fits the stated audience description answer honestly, based only on what
    they already know - not by looking anything up.
  </p>
  <div id="calibrate-question-display" class="status-line"></div>
  <textarea id="calibrate-answer-input" class="transcript-text-input" rows="4" placeholder="Type the real answer here..."></textarea>
  <button id="submit-answer-btn" class="btn-primary" style="margin-top: 12px;">Submit Answer</button>
  <div id="submit-answer-status" class="status-line"></div>
  <div id="graded-result"></div>
</div>

<div id="dataset-module" class="module-card">
  <h2>3. Collected Dataset</h2>
  <button id="export-dataset-btn" class="btn-secondary">Export Dataset (CSV)</button>
  <button id="clear-dataset-btn" class="btn-secondary">Clear All Data</button>
  <div id="dataset-status" class="status-line"></div>

  <h3 style="margin-top: 24px;">Empirical priorKnow by audience</h3>
  <div id="aggregate-table"></div>

  <h3 style="margin-top: 24px;">All records</h3>
  <div id="records-list"></div>
</div>

<script src="/js/helpers.js"></script>
<script src="/js/calibrate-priors.js"></script>

</body>
</html>
