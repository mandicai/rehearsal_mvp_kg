<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Compose Storyboard - Research Paper to Documentary</title>
  <!-- Cache-busting: this static site has no build step to fingerprint asset
     URLs, so local CSS/JS is fetched fresh every load via a timestamped
     query string instead of relying on a hard-refresh after each edit. -->
  <script>window.CACHE_BUST = Date.now();</script>
  <!-- Backend base URL: see html/index.html's own copy of this comment
     (js/helpers.js's API_BASE_URL) - nothing to configure here. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Coral+Pixels&family=Parastoo:wght@400..700&family=Rubik+80s+Fade&display=swap"
    rel="stylesheet">
  <!-- Monospace for the data-journalism (The Markup / Blacklight) styling -
       headings, kickers, labels, badges (see styles-index.css theme block). -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <script>document.write('<link rel="stylesheet" href="/styles-index.css?t=' + window.CACHE_BUST + '">');</script>
  <!-- No pdf.js here - PDF parsing only happens on html/index.html's upload step. -->
</head>

<body class="pub-to-doc-page">

  <!-- Page 2 of 2 (see html/index.html for the rest). A real page, arrived
   at from index.html's "Compose Storyboard" button - all state needed
   here (recordedTranscript, selectedFocusStatements, currentSections, ...)
   is restored from localStorage on load (see js/paper-extract.js's
   restoreDebugSession). Sits above .page-layout (not inside .main-column)
   so it stays a full-width, unmistakably page-level control once the
   sidebar fills in (see relocateArcSuggestionToSidebar and friends) -
   nested in the main column, it would otherwise sit at the same height as
   the sidebar, beside it rather than above it. -->
  <a href="index.html" id="back-to-setup-btn" class="btn-secondary" style="text-decoration: none;">&laquo; Back to
    setup</a>

  <!-- Hidden until the sidebar actually has content (see
   relocateAllSidebarModules) - collapses/expands #storyboard-sidebar as a
   whole (Suggested narrative arc + Your media + Source material all
   relocate into that one shared container - see relocateAllSidebarModules)
   so #paper-sections can take the full page width. Sits up here rather
   than inside .main-column so it's still reachable once the sidebar
   itself is display:none - a button inside the thing being hidden
   couldn't un-hide it. -->
  <button type="button" id="toggle-panels-btn" class="btn-secondary" style="display: none;">Hide panels</button>

  <div class="page-layout">

    <!-- Empty until an arc's accepted - #storyboard-arc-module,
     #media-bank-module, and #source-material-module (all starting in
     .main-column below, hidden) relocate in here once one is (see
     runAcceptArc/relocateArcSuggestionToSidebar and friends), freeing the
     main column for the arranged view while keeping the suggestion panel
     visible/clickable (a different arc can still be accepted from here
     afterward). #storyboard-arc-module always inserted first (see that
     function's own comment), so it stays above the other two regardless
     of relocation order. -->
    <div class="sidebar-stack" id="storyboard-sidebar"></div>

    <div class="main-column">

      <!-- Editable moodboard carried over from index.html. Adding/removing a
       reference here re-distills the suggested arc, mode, and techniques (see
       js/paper-extract.js's refreshSuggestionsFromMoodboard). Reuses index.html's
       moodboard element IDs so the same add/poll/render wiring applies. Relocates
       into the sidebar once an arc's accepted. -->
      <div class="module-card" id="moodboard-summary-module">
        <h2>Documentary moodboard</h2>
        <p style="font-size: 12px; opacity: 0.75; margin: 0 0 12px;">
          Add or remove references—we'll re-suggest the narrative arc, mode, and techniques from them.
        </p>
        <div id="moodboard-add-row" class="moodboard-add-row">
          <div class="moodboard-add-group">
            <input type="text" id="moodboard-name-input" placeholder="Name a documentary (e.g. Free Solo)">
            <button type="button" id="moodboard-add-name-btn" class="btn-secondary">Add</button>
          </div>
          <div class="moodboard-add-group">
            <input type="url" id="moodboard-url-input" placeholder="Paste a YouTube link">
            <button type="button" id="moodboard-add-url-btn" class="btn-secondary">Add</button>
          </div>
          <div class="moodboard-add-group">
            <label for="moodboard-file-input" class="moodboard-file-label">Upload footage</label>
            <input type="file" id="moodboard-file-input" accept="video/*">
          </div>
        </div>
        <div id="moodboard-list" class="moodboard-list"></div>
        <div id="moodboard-status" class="status-line"></div>
      </div><!-- /#moodboard-summary-module -->

      <div class="module-card" id="storyboard-arc-module">
        <!-- Fires automatically whenever restoreDebugSession finds a
         stated intent, whether or not an arc's already been accepted -
         see js/paper-extract.js's page-2 init - so switching to a
         different arc stays available even after arranging (this module
         then relocates into the left sidebar - see
         relocateArcSuggestionToSidebar). #suggest-arcs-btn stays hidden
         (runSuggestArcs still uses it internally to disable/re-enable
         itself while a request is in flight, but there's no visible
         button to click - just the status line below it, since every
         fresh landing on this page already re-triggers a suggestion). -->
        <h2>Suggested narrative arc</h2>

        <div id="suggest-arcs-row" style="display: none;">
          <!-- <button type="button" id="suggest-arcs-btn" class="btn-primary" style="display: none;">Suggest Narrative
            Arcs</button> -->
        </div>

        <!-- The recorded documentary-intent narration (+ play button) that
         guides the arc - lives here now (moved out of the hidden "Your media"
         module). Populated on page load by restoreDebugSession; same ids, so
         the JS refs (intentTranscriptDisplayEl/playIntentBtn) are unchanged. -->
        <!-- <div id="intent-transcript-display" style="display: none; margin-bottom: 12px;">
          <div id="intent-transcript-text" class="intent-transcript-text"></div>
          <button type="button" id="play-intent-btn" class="btn-primary" style="display: none;">▶</button>
        </div> -->

        <div id="arc-suggestion-panel" style="display: none;"></div>

        <!-- Moved to the very bottom of the module, after all other content
         (see js/paper-extract.js's suggestArcsStatusEl - referenced by id, so
         it works wherever it sits). Shows suggestion progress/errors below the
         arc panel + actions rather than up under the heading. -->
        <div id="suggest-arcs-status" class="status-line"></div>
      </div><!-- /#storyboard-arc-module -->

      <!-- Hidden for now (per request) - the one documentary-intent recording
       it used to hold moved up into #storyboard-arc-module above. Kept in the
       DOM (display:none, and no longer relocated to the sidebar - see
       relocateAllSidebarModules) so its child elements still exist for the JS
       refs that touch them. -->
      <div class="module-card" id="media-bank-module" style="display: none;">
        <h2>Your media</h2>

        <div id="media-bank-list"></div>

        <div class="media-bank-add-row">
          <button type="button" id="record-media-audio-btn" class="btn-secondary">Record Audio</button>
          <button type="button" id="record-media-video-btn" class="btn-secondary">Record Video</button>
          <input type="file" id="upload-media-input" accept="audio/*,video/*">
        </div>
        <div id="media-bank-status" class="status-line"></div>

        <!-- Live self-view while #record-media-video-btn is recording -
         removed once recording stops (see js/paper-extract.js). -->
        <video id="media-bank-video-preview" autoplay muted playsinline style="display: none;"></video>
      </div><!-- /#media-bank-module -->

      <!-- Hidden until an arc's accepted (see
       relocateSourceMaterialToSidebar) - once shown, relocates into the
       sidebar rather than staying here, right under #media-bank-module. A
       read-only reference listing of the extracted paper sections (see
       js/paper-extract.js's renderSourceMaterialList), kept in sync
       whenever currentSections changes on this page (adding/reassigning a
       section from within the arranged view). Not built from
       buildSectionBlock/renderSectionFeed like index.html's own editable
       feed - those hardcode their re-render target to #paper-sections
       (the movie editor here), so reusing them in a second, simultaneous
       location on this page would clobber it. -->
      <div class="module-card" id="source-material-module" style="display: none;">
        <h2>Source material</h2>
        <div id="source-material-list"></div>
      </div><!-- /#source-material-module -->

      <!-- Scenes deleted from the arranged view collect here, each with a
       Restore button (see js/paper-extract.js's renderDeletedScenesList).
       Hidden whenever nothing's deleted - that function toggles it. -->
      <div class="module-card" id="deleted-scenes-module" style="display: none;">
        <h2>Deleted source and scenes</h2>
        <div id="deleted-scenes-list"></div>
      </div><!-- /#deleted-scenes-module -->

      <!-- The movie editor (js/paper-extract.js's renderMovieEditor) renders
       into this once an arc is arranged. -->
      <div id="paper-sections"></div>

    </div><!-- /.main-column -->

  </div><!-- /.page-layout -->

  <script>
    document.write('<script src="/js/helpers.js?t=' + window.CACHE_BUST + '"><\/script>');
    document.write('<script src="/js/paper-extract.js?t=' + window.CACHE_BUST + '"><\/script>');
  </script>

</body>

</html>
